name: Refresh public restaurant menu
on:
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/menu.yml']
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
concurrency:
  group: restaurant-menu
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Refresh only public menu data
        run: node scripts/update.mjs
      - name: Publish changed menu
        run: |
          git config user.name 'restaurant-menu-bot'
          git config user.email 'restaurant-menu-bot@users.noreply.github.com'
          git add -- menu.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public restaurant menu'
            git push
          fi
